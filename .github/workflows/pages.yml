# Publica o app no GitHub Pages a cada push na main.
# O aluno abre a URL para ver os defeitos; para consertar, clona este repositório.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        # Liga o Pages no modo "GitHub Actions" por conta própria. Sem isto, a
        # action falha com "Get Pages site failed" até alguém trocar a fonte na
        # mão em Settings, e o repositório fica publicando o código cru pelo
        # modo "Deploy from a branch".
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
